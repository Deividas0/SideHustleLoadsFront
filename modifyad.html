<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Ad</title>
    <link rel="stylesheet" href="css/modifyad.css">
</head>
<body>
    <header class="header">
        <a href="/ads.html" class="back-link">Back to Listings</a>
        <h1>Modify Ad</h1>
    </header>
    <div class="container">
        <form id="modifyAdForm">
            <input type="hidden" id="adId" name="adId">
            
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="description">Description</label>
            <textarea id="description" name="description" required></textarea>

            <label for="pickUpCountry">Pick-up Country</label>
            <input type="text" id="pickUpCountry" name="pickUpCountry" readonly>

            <label for="countryToDeliver">Country to Deliver</label>
            <input type="text" id="countryToDeliver" name="countryToDeliver" readonly>

            <label for="pickUpLocation">Pick-up Location</label>
            <input type="text" id="pickUpLocation" name="pickUpLocation" required>

            <label for="deliveryLocation">Delivery Location</label>
            <input type="text" id="deliveryLocation" name="deliveryLocation" required>

            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight" required>

            <label for="height">Height (cm)</label>
            <input type="number" id="height" name="height" required>

            <label for="width">Width (cm)</label>
            <input type="number" id="width" name="width" required>

            <label for="loadType">Load Type</label>
            <input type="text" id="loadType" name="loadType" required>

            <button type="submit">Update Ad</button>
        </form>
    </div>
    <script src="js/modifyad.js"></script>
</body>
</html>
