<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Hustle Loads</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
</head>
<body >
    <div class="container">
        <header class="header">
            <h1>Welcome to Side Hustle Loads</h1>
            <p>Your go-to platform for finding and placing delivery loads easily.</p>
        </header>
        <main class="main-content">
            <p>Looking for loads to deliver? You've come to the right place.</p>
            <p>Place your delivery loads and let us connect you with reliable carriers!</p>
            <p id="time-display"></p>
            <p id="total_listings"></p>
            <div class="button-container">
                <button id="loginButton" class="btn">Login</button>
                <button id="registerButton" class="btn">Register</button>
            </div>
        </main>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
