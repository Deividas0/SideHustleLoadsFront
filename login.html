<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Side Hustle Loads</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Welcome Back</h1>
            <p>Log in to your Side Hustle Loads account.</p>
            <p id="error-message" style="color: red;"></p>
        </header>

        <main class="main-content">
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn">Login</button>
            </form>
            <p class="register-link">Don't have an account? <a href="/registration.html">Register here</a>.</p>
        </main>

        <footer>
            <p>&copy; 2024 Side Hustle Loads. All rights reserved.</p>
        </footer>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
