<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Ad</title>
    <link rel="stylesheet" href="css/newad.css">
</head>
<body>
    <header class="header">
        <a href="/ads.html" class="back-link">Back to Listings</a>
        <h1>Create New Ad</h1>
    </header>
    <main class="form-container">
        <form id="newAdForm">
            <div class="form-column left-column">
                <label for="title">Title<span style="color: red;">*</span></label>
                <input type="text" id="title" name="title" placeholder="Enter ad title" required>

                <label for="description">Description<span style="color: red;">*</span></label>
                <textarea id="description" name="description" placeholder="Enter ad description" required></textarea>

                <label for="pickUpCountry">Pick-up Country<span style="color: red;">*</span></label>
                <select id="pickUpCountry" name="pickUpCountry" required>
                    <option value="" disabled selected>Select a country</option>
                    <option value="Austria">Austria</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Bulgaria">Bulgaria</option>
                    <option value="Croatia">Croatia</option>
                    <option value="Cyprus">Cyprus</option>
                    <option value="Czech Republic">Czech Republic</option>
                    <option value="Denmark">Denmark</option>
                    <option value="Estonia">Estonia</option>
                    <option value="Finland">Finland</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Greece">Greece</option>
                    <option value="Hungary">Hungary</option>
                    <option value="Ireland">Ireland</option>
                    <option value="Italy">Italy</option>
                    <option value="Latvia">Latvia</option>
                    <option value="Lithuania">Lithuania</option>
                    <option value="Luxembourg">Luxembourg</option>
                    <option value="Malta">Malta</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Poland">Poland</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Romania">Romania</option>
                    <option value="Slovakia">Slovakia</option>
                    <option value="Slovenia">Slovenia</option>
                    <option value="Spain">Spain</option>
                    <option value="Sweden">Sweden</option>
                </select>

                <label for="deliveryCountry">Country to Deliver<span style="color: red;">*</span></label>
                <select id="deliveryCountry" name="deliveryCountry" required>
                    <option value="" disabled selected>Select a country</option>
                    <option value="Austria">Austria</option>
                    <option value="Belgium">Belgium</option>
                    <option value="Bulgaria">Bulgaria</option>
                    <option value="Croatia">Croatia</option>
                    <option value="Cyprus">Cyprus</option>
                    <option value="Czech Republic">Czech Republic</option>
                    <option value="Denmark">Denmark</option>
                    <option value="Estonia">Estonia</option>
                    <option value="Finland">Finland</option>
                    <option value="France">France</option>
                    <option value="Germany">Germany</option>
                    <option value="Greece">Greece</option>
                    <option value="Hungary">Hungary</option>
                    <option value="Ireland">Ireland</option>
                    <option value="Italy">Italy</option>
                    <option value="Latvia">Latvia</option>
                    <option value="Lithuania">Lithuania</option>
                    <option value="Luxembourg">Luxembourg</option>
                    <option value="Malta">Malta</option>
                    <option value="Netherlands">Netherlands</option>
                    <option value="Poland">Poland</option>
                    <option value="Portugal">Portugal</option>
                    <option value="Romania">Romania</option>
                    <option value="Slovakia">Slovakia</option>
                    <option value="Slovenia">Slovenia</option>
                    <option value="Spain">Spain</option>
                    <option value="Sweden">Sweden</option>
                </select>

                <label for="pickUpLocation">Pick-up Location<span style="color: red;">*</span></label>
                <input type="text" id="pickUpLocation" name="pickUpLocation" placeholder="Enter pick-up location" required>

                <label for="deliveryLocation">Delivery Location<span style="color: red;">*</span></label>
                <input type="text" id="deliveryLocation" name="deliveryLocation" placeholder="Enter delivery location" required>
            </div>
            <div class="form-column right-column">
                <label for="weight">Weight (kg)<span style="color: red;">*</span></label>
                <input type="number" id="weight" name="weight" placeholder="Enter weight" required>

                <label for="height">Height (cm)<span style="color: red;">*</span></label>
                <input type="number" id="height" name="height" placeholder="Enter height" required>

                <label for="width">Width (cm)<span style="color: red;">*</span></label>
                <input type="number" id="width" name="width" placeholder="Enter width" required>

                <label for="loadType">Load Type</label>
                <input type="text" id="loadType" name="loadType" placeholder="Enter load type">

                <label for="imageFile">Upload Image</label>
                <input type="file" id="imageFile" name="imageFile" accept="image/*">
            </div>
            <div class="form-actions">
                <button type="submit">Create Ad</button>
            </div>
        </form>
    </main>
    <script src="js/newad.js"></script>
</body>
</html>
